name: Qullamaggie Auto Scanner

on:
  schedule:
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # <-- Updated here

      - name: Set up Python
        uses: actions/setup-python@v5 # <-- Updated here
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Qullamaggie Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u scanner.py
