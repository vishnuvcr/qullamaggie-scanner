name: Qullamaggie Auto Scanner

on:
  schedule:
    # Runs every 15 mins during Indian Market Hours (UTC 4:00 to 10:59)
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch: 
    # Allows you to click a button to run it manually anytime

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Qullamaggie Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python scanner.py
