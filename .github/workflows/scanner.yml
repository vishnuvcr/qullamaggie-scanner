name: Qullamaggie Scanner

on:
  workflow_dispatch: # Allows you to still click the "Run workflow" button manually
  schedule:
    # 1. Pre-Market Run (9:00 AM IST -> 03:30 UTC) Monday-Friday
    - cron: '30 3 * * 1-5'
    
    # 2. Hourly Market Runs (10:15 AM to 3:15 PM IST -> 04:45 to 09:45 UTC) Monday-Friday
    - cron: '45 4-9 * * 1-5'
    
    # 3. After-Market Run (4:00 PM IST -> 10:30 UTC) Monday-Friday
    - cron: '30 10 * * 1-5'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up execution time
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests
          
      - name: Run Qullamaggie Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u scanner.py
